name: ORION verification

on:
  push:
    branches: [developer7-market-data-quality]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-binans-scanner:
    name: Verify binansScanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: binansScanner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: python -m pip install fastapi uvicorn numpy pandas pandas-ta python-binance

      - name: Build branch-safe verification entry point
        run: |
          cat > verify.py <<'PY'
          from __future__ import annotations

          import subprocess
          import sys

          TEST_MODULES = (
              "tests.test_market_models_contract",
              "tests.test_market_data_quality_contract",
              "tests.test_binance_mapper_quality",
          )

          completed = subprocess.run(
              [sys.executable, "-m", "unittest", *TEST_MODULES, "-v"],
              check=False,
          )
          raise SystemExit(completed.returncode)
          PY

      - name: Run verification entry point
        run: python verify.py

      - name: Verify Market Data Quality regression slice
        run: python -m unittest tests.test_market_data_quality_contract tests.test_binance_mapper_quality -v
