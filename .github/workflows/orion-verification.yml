name: ORION verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-binans-scanner:
    name: Verify binansScanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: binansScanner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt numpy pandas pandas-ta python-binance

      - name: Verify syntax and full unittest suite
        run: python verify.py
