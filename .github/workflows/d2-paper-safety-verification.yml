name: ORION D2 Paper Safety Verification

on:
  push:
    branches:
      - phase-a/d2-paper-safety-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d2-paper-safety:
    name: D2 Exact-HEAD Paper Safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: binansScanner
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_CHECKOUT_SHA=${ACTUAL_CHECKOUT_SHA}"
          test "${EXPECTED_SHA}" = "${ACTUAL_CHECKOUT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pandas-ta python-binance requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: D2 execution contracts
        env:
          PYTHONPATH: .
        run: |
          python -m unittest \
            tests.test_execution_composition_root \
            tests.test_execution_validation_contract \
            tests.test_decision_execution_bridge \
            tests.test_pipeline_execution_e2e -v

      - name: Repository parity gate
        working-directory: .
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python tools/verify_repository_parity.py

      - name: Final exact checkout and clean-tree gate
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_CHECKOUT_SHA=${ACTUAL_CHECKOUT_SHA}"
          test "${EXPECTED_SHA}" = "${ACTUAL_CHECKOUT_SHA}"
          test -z "$(git status --porcelain)"
          echo "WORKING_TREE=CLEAN"
