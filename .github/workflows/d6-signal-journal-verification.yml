name: D6 Signal Journal Exact-Head Verification

on:
  workflow_dispatch:
  push:
    branches:
      - phase-a/experimental-observation-assembly

permissions:
  contents: read

jobs:
  signal-journal-verification:
    name: Verify D6 Signal Journal exact HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        working-directory: binansScanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt numpy pandas pandas-ta python-binance requests

      - name: Exact checkout verification
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_CHECKOUT_SHA=${ACTUAL_CHECKOUT_SHA}"
          test "${EXPECTED_SHA}" = "${ACTUAL_CHECKOUT_SHA}"
          echo "EXACT CHECKOUT PASS"

      - name: Signal Journal contract tests
        working-directory: binansScanner
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_signal_journal_contract -v
          echo "SIGNAL JOURNAL TESTS PASS"

      - name: Repository parity and working tree verification
        run: |
          set -euo pipefail
          EXPECTED_SHA="${GITHUB_SHA}"
          ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          WORKING_TREE="$(git status --porcelain)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_CHECKOUT_SHA=${ACTUAL_CHECKOUT_SHA}"
          echo "WORKING_TREE=${WORKING_TREE}"
          test "${EXPECTED_SHA}" = "${ACTUAL_CHECKOUT_SHA}"
          test -z "${WORKING_TREE}"
          echo "PARITY PASS"
          echo "WORKING TREE CLEAN"
          echo "VERIFICATION PASSED"
