name: D1 Observer Testability Verification

on:
  push:
    branches:
      - phase-a/d1-observer-testability-fix
  workflow_dispatch:

jobs:
  d1-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_CHECKOUT_SHA=$ACTUAL_CHECKOUT_SHA"
          test "$EXPECTED_SHA" = "$ACTUAL_CHECKOUT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pandas-ta python-binance requests
          if [ -f binansScanner/requirements.txt ]; then pip install -r binansScanner/requirements.txt; fi

      - name: D1 observer tests
        working-directory: binansScanner
        run: |
          python -m unittest tests.test_orion_phase_a_runtime_observer tests.test_orion_phase_a_runtime_lookback -v

      - name: Actual ORION 5x3 runtime observation
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          rm -rf /tmp/orion_phase_a_artifacts
          python tools/orion_phase_a_runtime_observer.py \
            --baseline c54dc67792776da905a3efb1f667c1869c15db3d \
            --artifact-root /tmp/orion_phase_a_artifacts \
            --runtime-commit "$EXPECTED_SHA"
          test -f /tmp/orion_phase_a_artifacts/signal-observations/*/runtime_results.jsonl
          test -f /tmp/orion_phase_a_artifacts/signal-observations/*/observations.jsonl

      - name: Upload runtime observation artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-runtime-observation-artifacts
          path: /tmp/orion_phase_a_artifacts/
          if-no-files-found: error

      - name: Repository parity and clean tree
        run: |
          python tools/verify_repository_parity.py
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
