name: ORION Paper Extended Verification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable source SHA to execute
        required: true
        type: string
      duration_hours:
        description: Paper duration in hours
        required: true
        default: '1.0'
        type: string
      starting_capital:
        description: Starting capital
        required: true
        default: '200'
        type: string
      allocation_rate:
        description: Fixed allocation rate
        required: true
        default: '0.10'
        type: string
      top_n:
        description: Active top-N
        required: true
        default: '10'
        type: string

permissions:
  contents: read

jobs:
  paper-extended-verification:
    name: Paper Extended Verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      DURATION_HOURS: ${{ inputs.duration_hours }}
      STARTING_CAPITAL: ${{ inputs.starting_capital }}
      ALLOCATION_RATE: ${{ inputs.allocation_rate }}
      TOP_N: ${{ inputs.top_n }}
      EVIDENCE_DIR: ${{ runner.temp }}/orion-paper-extended-${{ github.run_id }}

    steps:
      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

      - name: Validate requested source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid source_sha: $SOURCE_SHA" >&2
            exit 1
          fi
          printf 'requested_source_sha=%s\n' "$SOURCE_SHA" > "$EVIDENCE_DIR/source-sha.txt"

      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Assert exact checkout and clean tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'requested_sha=%s\nactual_checkout_sha=%s\n' "$SOURCE_SHA" "$actual" | tee "$EVIDENCE_DIR/checkout.txt"
          test "$actual" = "$SOURCE_SHA"
          status="$(git status --porcelain --untracked-files=all)"
          printf 'status=%s\n' "$status" | tee "$EVIDENCE_DIR/clean-tree-before.txt"
          test -z "$status"

      - name: Capture immutable source fingerprint
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$EVIDENCE_DIR/source-head-before.txt"
          git diff-tree --no-commit-id --name-status -r "$SOURCE_SHA" > "$EVIDENCE_DIR/source-tree.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: binansScanner/requirements.txt

      - name: Install repository dependencies
        working-directory: binansScanner
        run: python -m pip install -r requirements.txt numpy pandas pandas-ta python-binance

      - name: Capture runner metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
            printf 'python_version=%s\n' "$(python --version 2>&1)"
            printf 'duration_hours=%s\n' "$DURATION_HOURS"
            printf 'starting_capital=%s\n' "$STARTING_CAPITAL"
            printf 'capital_mode=FIXED_ALLOCATION\n'
            printf 'allocation_rate=%s\n' "$ALLOCATION_RATE"
            printf 'universe=dynamic\n'
            printf 'top_n=%s\n' "$TOP_N"
            printf 'paper_only=true\n'
            printf 'live_execution=false\n'
            printf 'credentials_used=false\n'
            printf 'exchange_orders=false\n'
            printf 'start_timestamp=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$EVIDENCE_DIR/run-config.txt"

      - name: Enforce no-credentials environment
        shell: bash
        run: |
          set -euo pipefail
          for name in BINANCE_API_KEY BINANCE_API_SECRET API_KEY API_SECRET; do
            if [[ -n "${!name:-}" ]]; then
              echo "Forbidden credential environment variable present: $name" >&2
              exit 1
            fi
          done

      - name: Run Paper Extended Verification
        id: paper
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          output_dir="runs/paper/PAPER-EXTENDED-${GITHUB_RUN_ID}"
          mkdir -p "$output_dir"
          set +e
          python -m tools.orion_paper_8h_runner \
            --duration-hours "$DURATION_HOURS" \
            --starting-capital "$STARTING_CAPITAL" \
            --capital-mode FIXED_ALLOCATION \
            --allocation-rate "$ALLOCATION_RATE" \
            --universe dynamic \
            --top-n "$TOP_N" \
            --output-dir "$output_dir" \
            2>&1 | tee "$EVIDENCE_DIR/paper-stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/exit-code.txt"
          printf 'output_dir=%s\n' "$output_dir" > "$EVIDENCE_DIR/output-dir.txt"

      - name: Locate and validate events.jsonl
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(cut -d= -f2- "$EVIDENCE_DIR/output-dir.txt")"
          events="$output_dir/events.jsonl"
          test -f "$events"
          cp "$events" "$EVIDENCE_DIR/events.jsonl"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          events_path = evidence_dir / "events.jsonl"
          events = [
              json.loads(line)
              for line in events_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          run_ends = [
              e for e in events
              if e.get("event") == "run_end" or e.get("event_type") == "run_end"
          ]
          if not run_ends:
              raise SystemExit("Missing run_end event")

          last = run_ends[-1]
          required = (
              "runtime_failure",
              "runtime_health",
              "capital_replay_equal",
              "runtime_replay_equal",
              "runtime_repeat_recovery_equal",
              "paper_only_verification",
              "exchange_orders",
              "credentials_used",
          )
          missing = [key for key in required if key not in last]
          if missing:
              raise SystemExit(f"run_end missing required fields: {missing}")

          checks = {
              "exit_code_zero": int((evidence_dir / "exit-code.txt").read_text().strip()) == 0,
              "runtime_failure": last["runtime_failure"] is None,
              "runtime_health": last["runtime_health"] is True,
              "capital_replay_equal": last["capital_replay_equal"] is True,
              "runtime_replay_equal": last["runtime_replay_equal"] is True,
              "runtime_repeat_recovery_equal": last["runtime_repeat_recovery_equal"] is True,
              "paper_only_verification": last["paper_only_verification"] is True,
              "exchange_orders": last["exchange_orders"] is False,
              "credentials_used": last["credentials_used"] is False,
          }

          (evidence_dir / "run-end.json").write_text(
              json.dumps(last, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          (evidence_dir / "final-verification.json").write_text(
              json.dumps(checks, indent=2, sort_keys=True),
              encoding="utf-8",
          )

          if not all(checks.values()):
              raise SystemExit(f"Extended verification failed: {checks}")
          PY

      - name: Record end timestamp and immutable-source check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'end_timestamp=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$EVIDENCE_DIR/run-config.txt"
          if git rev-parse HEAD > "$EVIDENCE_DIR/source-head-after.txt"; then
            test "$(cat "$EVIDENCE_DIR/source-head-after.txt")" = "$SOURCE_SHA"
          fi

      - name: Verify clean tree after run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(cut -d= -f2- "$EVIDENCE_DIR/output-dir.txt" 2>/dev/null || true)"
          if [[ -n "$output_dir" && -d "$output_dir" ]]; then
            rm -rf "$output_dir"
          fi
          status="$(git status --porcelain --untracked-files=all)"
          printf 'status=%s\n' "$status" | tee "$EVIDENCE_DIR/clean-tree-after.txt"
          test -z "$status"

      - name: Build artifact manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
            printf 'python_version=%s\n' "$(python --version 2>&1)"
            printf 'duration_hours=%s\n' "$DURATION_HOURS"
            printf 'start_timestamp=%s\n' "$(grep '^start_timestamp=' "$EVIDENCE_DIR/run-config.txt" 2>/dev/null | cut -d= -f2- || true)"
            printf 'end_timestamp=%s\n' "$(grep '^end_timestamp=' "$EVIDENCE_DIR/run-config.txt" 2>/dev/null | cut -d= -f2- || true)"
            printf 'exit_code=%s\n' "$(cat "$EVIDENCE_DIR/exit-code.txt" 2>/dev/null || echo unavailable)"
            printf 'evidence_paths=events.jsonl,paper-stdout.txt,run-config.txt,source-sha.txt,checkout.txt,exit-code.txt,run-end.json,final-verification.json\n'
          } > "$EVIDENCE_DIR/artifact-manifest.txt"

      - name: Upload Paper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-paper-extended-${{ github.run_id }}
          path: ${{ runner.temp }}/orion-paper-extended-${{ github.run_id }}
          if-no-files-found: error

      - name: Enforce successful Paper result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_DIR/final-verification.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          checks = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "final-verification.json").read_text(encoding="utf-8"))
          assert all(checks.values()), checks
          PY
