name: D2 REAL Historical Replay 7D
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [d2/real-historical-replay-7d-20260902]
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aab1fc15f07adfaeb4d617d669e459f77f8b0895
          fetch-depth: 0
      - name: Verify replay baseline and isolation
        run: |
          test "$(git rev-parse HEAD)" = "aab1fc15f07adfaeb4d617d669e459f77f8b0895"
          test "$(git rev-parse c6126e0b94781608147f321f737742f87f48bf2f)" = "c6126e0b94781608147f321f737742f87f48bf2f"
          git merge-base --is-ancestor c6126e0b94781608147f321f737742f87f48bf2f HEAD
          test "$(git diff --name-only c6126e0b94781608147f321f737742f87f48bf2f HEAD)" = $'.github/workflows/d2-real-historical-replay-7d.yml\nbinansScanner/real_historical_replay.py'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: binansScanner
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install numpy pandas pandas-ta python-binance
          python -m pip check
          python -c "import numpy, pandas, pandas_ta, binance; print('DEPENDENCIES_OK', numpy.__version__, pandas.__version__)"
      - name: Compile
        working-directory: binansScanner
        run: python -m compileall -q .
      - name: Real dataset and replay
        working-directory: binansScanner
        env:
          PYTHONPATH: ${{ github.workspace }}/binansScanner:${{ github.workspace }}
        run: python real_historical_replay.py --output real_replay_7d
      - name: Determinism gate
        working-directory: binansScanner
        env:
          PYTHONPATH: ${{ github.workspace }}/binansScanner:${{ github.workspace }}
        run: |
          python - <<'PY'
          import json, pathlib
          from real_historical_replay import run
          root=pathlib.Path('real_replay_7d/dataset')
          run(root,pathlib.Path('real_replay_7d/run_b'))
          a=json.loads(pathlib.Path('real_replay_7d/run/campaign_report.json').read_text())
          b=json.loads(pathlib.Path('real_replay_7d/run_b/campaign_report.json').read_text())
          keys=('dataset_hash','processed_event_count','duplicate_event_count','out_of_order_count','orders','fills','large_move_count','capital_state','lookahead_verification','end_of_run_policy')
          assert all(a[k]==b[k] for k in keys)
          assert a['lookahead_verification'] is True and a['out_of_order_count']==0
          assert a['end_of_run_policy']=='CLOSE_AT_END' and a['paper_only'] is True
          assert a['safety']['credentials_used'] is False and a['safety']['live_orders'] is False
          pathlib.Path('real_replay_7d/determinism.json').write_text(json.dumps({'result':'PASS','core_metrics_equal':True},indent=2)+'\n')
          PY
      - name: Clean tree
        run: test -z "$(git status --porcelain)"
      - name: Finalize qualification evidence
        working-directory: binansScanner
        run: |
          test -f real_replay_7d/dataset/manifest.json
          test -f real_replay_7d/run/campaign_report.json
          test -f real_replay_7d/determinism.json
          python - <<'PY'
          import json, pathlib
          report=json.loads(pathlib.Path('real_replay_7d/run/campaign_report.json').read_text())
          det=json.loads(pathlib.Path('real_replay_7d/determinism.json').read_text())
          assert det['result']=='PASS'
          assert report['lookahead_verification'] is True
          assert report['out_of_order_count']==0
          assert report['end_of_run_policy']=='CLOSE_AT_END'
          assert report['paper_only'] is True
          assert report['safety']['credentials_used'] is False
          assert report['safety']['live_orders'] is False
          pathlib.Path('real_replay_7d/qualification.json').write_text(json.dumps({'dataset_integrity':'PASS','causality':'PASS','replay_determinism':'PASS','paper_only_safety':'PASS','capital_integrity':'EVIDENCED_IN_REPORT','evidence_complete':True,'campaign':'7D','policy':'CLOSE_AT_END'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d2-real-historical-replay-7d
          path: binansScanner/real_replay_7d/
          if-no-files-found: error
