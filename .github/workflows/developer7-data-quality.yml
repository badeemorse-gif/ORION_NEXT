name: Developer 7 Data Quality

on:
  push:
    branches: [developer7-market-data-quality]

permissions:
  contents: read

jobs:
  data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: binansScanner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt numpy pandas pandas-ta python-binance
      - name: Run Developer 7 data-quality contract suite
        run: python -m unittest tests.test_market_data_quality_contract tests.test_binance_mapper_quality -v
