name: oneoff-orion-restore-branch-update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_orion_restore_dynamic_branch_update.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update restore utility
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('tools/orion_restore_gui.pyw')
          s = p.read_text(encoding='utf-8')
          block = re.compile(r'BRANCHES = \(.*?SYNC_BRANCHES = \(.*?\)\n', re.S)
          new_block = '''FALLBACK_BRANCHES = (\n    "main",\n    "orion-canonical-pipeline-boundary",\n    "phase2/core-intelligence-hardening",\n)\nDEFAULT_BRANCH = "phase2/core-intelligence-hardening"\nALL_BRANCH = "ALL"\n'''
          if not block.search(s):
              raise SystemExit('Branch constants block not found; refusing to modify.')
          s = block.sub(new_block, s, count=1)
          s = s.replace('initial = ARG_BRANCH if ARG_BRANCH in BRANCHES else DEFAULT_BRANCH', 'self.branches = list(FALLBACK_BRANCHES)\n        initial = ARG_BRANCH if ARG_BRANCH in self.branches else DEFAULT_BRANCH', 1)
          s = s.replace('return value if value == ALL_BRANCH or value in BRANCHES else DEFAULT_BRANCH', 'return value if value == ALL_BRANCH or value in self.branches else DEFAULT_BRANCH', 1)
          s = s.replace('values=(ALL_BRANCH, *BRANCHES)', 'values=(ALL_BRANCH, *self.branches)', 1)
          branch_method = re.compile(r'    def _branch_changed\(self, _event=None\):\n.*?(?=    def _info_row\()', re.S)
          branch_replacement = r'''    def _branch_changed(self, _event=None):
        if not self.running:
            if self.branch == ALL_BRANCH:
                self.source_label.configure(text=f"GitHub → Git → Local  |  ALL ({len(self.branches)} branches)")
            else:
                self.source_label.configure(text=f"GitHub → Git → Local  |  {self.branch}")
            self._write(f"Target branch changed to: {self.branch}")

    def _discover_remote_branches(self):
        """Discover the current GitHub branch list without changing the working tree."""
        code, lines = self._git(["ls-remote", "--heads", REMOTE])
        if code != 0:
            raise RuntimeError("تعذر قراءة فروع GitHub الحالية.\n" + ("\n".join(lines) or "git ls-remote failed."))
        branches = []
        for line in lines:
            parts = line.split("\t", 1)
            if len(parts) != 2:
                continue
            ref = parts[1].strip()
            if ref.startswith("refs/heads/"):
                name = ref[len("refs/heads/"):]
                if name and name not in branches:
                    branches.append(name)
        if not branches:
            raise RuntimeError("لم يتم العثور على أي فرع في GitHub.")
        return sorted(branches, key=lambda value: (value != "main", value.lower()))

    def _apply_branches(self, branches):
        current = self.branch_var.get().strip()
        self.branches = list(branches)
        values = (ALL_BRANCH, *self.branches)
        self.branch_combo.configure(values=values)
        if current in values:
            self.branch_var.set(current)
        elif DEFAULT_BRANCH in self.branches:
            self.branch_var.set(DEFAULT_BRANCH)
        else:
            self.branch_var.set(self.branches[0])
        self._branch_changed()
        self._write(f"تم تحديث قائمة الفروع من GitHub: {len(self.branches)} فرعًا.")

    def refresh_branches(self):
        if self.running:
            return
        self._status("جاري تحديث الفروع...", self.accent)
        threading.Thread(target=self._refresh_branches_worker, daemon=True).start()

    def _refresh_branches_worker(self):
        try:
            branches = self._discover_remote_branches()
            self.root.after(0, self._apply_branches, branches)
            self.root.after(0, self._status, "جاهز للاستعادة", self.success)
        except Exception as exc:
            self._ui(f"تعذر تحديث قائمة الفروع: {exc}")
            self.root.after(0, self._status, "تعذر تحديث الفروع — القائمة السابقة متاحة", self.warning)

'''
          if not branch_method.search(s):
              raise SystemExit('Branch method marker not found; refusing to modify.')
          s = branch_method.sub(branch_replacement, s, count=1)
          restore_method = re.compile(r'    def _restore\(self\):\n.*?(?=    def _restore_all\()', re.S)
          restore_match = restore_method.search(s)
          if not restore_match:
              raise SystemExit('Restore method marker not found; refusing to modify.')
          restore_body = restore_match.group(0)
          header = re.compile(r'    def _restore\(self\):\n        branch = self\.branch\n        remote_ref = f"\{REMOTE\}/\{branch\}" if branch != ALL_BRANCH else None\n        try:\n            if branch == ALL_BRANCH:\n                self\._restore_all\(\)\n                return\n', re.S)
          replacement_header = r'''    def _restore(self):
        branch = self.branch
        try:
            branches = self._discover_remote_branches()
            self.root.after(0, self._apply_branches, branches)
            branch = self.branch_var.get().strip()
            if branch == ALL_BRANCH:
                self._restore_all(branches)
                return
            if branch not in branches:
                raise RuntimeError(f"الفرع غير موجود حاليًا على GitHub: {branch}")
            remote_ref = f"{REMOTE}/{branch}"
'''
          if not header.search(restore_body):
              raise SystemExit('Restore header marker not found; refusing to modify.')
          restore_body = header.sub(replacement_header, restore_body, count=1)
          s = s[:restore_match.start()] + restore_body + s[restore_match.end():]
          sync_method = re.compile(r'    def _sync_all_refs\(self\):\n.*?(?=    def _stats\()', re.S)
          sync_replacement = r'''    def _sync_all_refs(self, branches):
        """Fetch every current GitHub branch into local remote-tracking refs."""
        self._ui(f"[ALL] جلب جميع فروع GitHub ({len(branches)} فرعًا) إلى مستودع Git المحلي...")
        code, lines = self._git(["fetch", REMOTE, "--prune"])
        if code != 0:
            raise RuntimeError("فشل تحديث فروع GitHub.\n" + ("\n".join(lines) or "Git fetch --prune failed."))
        for line in lines:
            self._ui(line)
        commits = {}
        for index, branch in enumerate(branches, 1):
            code, lines = self._git(["fetch", REMOTE, branch])
            if code != 0:
                raise RuntimeError(f"فشل جلب GitHub/{branch}.\n" + ("\n".join(lines) or "Git fetch failed."))
            ref = f"{REMOTE}/{branch}"
            commits[branch] = self._git_value(["rev-parse", "--verify", ref])
            self._ui(f"[{index}/{len(branches)}] GitHub/{branch}: {commits[branch]}")
        current_branch = self._git_value(["branch", "--show-current"])
        current_commit = self._git_value(["rev-parse", "HEAD"])
        self._ui(f"Local working branch remains: {current_branch or '(detached HEAD)'}")
        self._ui(f"Local working commit remains: {current_commit}")
        self._save_all_sync_state(commits)
        return commits

'''
          if not sync_method.search(s):
              raise SystemExit('Sync-all method marker not found; refusing to modify.')
          s = sync_method.sub(sync_replacement, s, count=1)
          s = s.replace('def _restore_all(self):', 'def _restore_all(self, branches):', 1)
          s = s.replace('ALL = تحديث الفروع الثلاثة داخل مستودع Git المحلي.', 'ALL = تحديث جميع فروع GitHub الحالية ({len(branches)} فرعًا) داخل مستودع Git المحلي.', 1)
          s = s.replace('commits = self._sync_all_refs()', 'commits = self._sync_all_refs(branches)', 1)
          s = s.replace('الفروع الثلاثة محدثة محليًا.', 'تم تحديث {len(commits)} فرعًا محليًا.', 1)
          s = s.replace('تمت مزامنة الفروع الثلاثة محليًا. الإحصائيات: 0 لأن working tree لم يتغير.', 'تمت مزامنة جميع الفروع ({len(commits)}) محليًا. الإحصائيات: 0 لأن working tree لم يتغير.', 1)
          main_method = re.compile(r'    root = tk\.Tk\(\)\n    app = OrionRestoreApp\(root\)\n    app\.source_label\.configure\(.*?\n    root\.mainloop\(\)\n', re.S)
          main_replacement = r'''    root = tk.Tk()
    app = OrionRestoreApp(root)
    app.source_label.configure(
        text=(f"GitHub → Git → Local  |  ALL ({len(app.branches)} branches)"
              if app.branch == ALL_BRANCH
              else f"GitHub → Git → Local  |  {app.branch}")
    )
    root.after(250, app.refresh_branches)
    root.mainloop()
'''
          if not main_method.search(s):
              raise SystemExit('Main method marker not found; refusing to modify.')
          s = main_method.sub(main_replacement, s, count=1)
          p.write_text(s, encoding='utf-8')
          compile(s, str(p), 'exec')
      - name: Commit change
        shell: bash
        run: |
          git config user.name 'ORION automation'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/orion_restore_gui.pyw
          git commit -m 'Update ORION Restore: discover and sync all branches'
          git push
