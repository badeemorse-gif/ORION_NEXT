name: oneoff-orion-restore-branch-update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_orion_restore_dynamic_branch_update.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update restore utility
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/orion_restore_gui.pyw')
          s = p.read_text(encoding='utf-8')
          old = '''BRANCHES = (\n    "main",\n    "orion-canonical-pipeline-boundary",\n    "phase2/core-intelligence-hardening",\n)\nDEFAULT_BRANCH = "phase2/core-intelligence-hardening"\nALL_BRANCH = "ALL"\nSYNC_BRANCHES = (\n    "main",\n    "orion-canonical-pipeline-boundary",\n    "phase2/core-intelligence-hardening",\n)\n'''
          new = '''FALLBACK_BRANCHES = (\n    "main",\n    "orion-canonical-pipeline-boundary",\n    "phase2/core-intelligence-hardening",\n)\nDEFAULT_BRANCH = "phase2/core-intelligence-hardening"\nALL_BRANCH = "ALL"\n'''
          if old not in s:
              raise SystemExit('Expected current restore source was not found; refusing to modify.')
          s = s.replace(old, new, 1)
          s = s.replace('initial = ARG_BRANCH if ARG_BRANCH in BRANCHES else DEFAULT_BRANCH', 'self.branches = list(FALLBACK_BRANCHES)\n        initial = ARG_BRANCH if ARG_BRANCH in self.branches else DEFAULT_BRANCH', 1)
          s = s.replace('return value if value == ALL_BRANCH or value in BRANCHES else DEFAULT_BRANCH', 'return value if value == ALL_BRANCH or value in self.branches else DEFAULT_BRANCH', 1)
          s = s.replace('values=(ALL_BRANCH, *BRANCHES)', 'values=(ALL_BRANCH, *self.branches)', 1)
          s = s.replace('ALL (3 branches)', 'ALL ({len(self.branches)} branches)')
          marker = '    def _info_row(self, parent, label, value):\n'
          methods = '''    def _discover_remote_branches(self):\n        """Discover the current GitHub branch list without changing the working tree."""\n        code, lines = self._git(["ls-remote", "--heads", REMOTE])\n        if code != 0:\n            raise RuntimeError("تعذر قراءة فروع GitHub الحالية.\\n" + ("\\n".join(lines) or "git ls-remote failed."))\n        branches = []\n        for line in lines:\n            parts = line.split("\\t", 1)\n            if len(parts) != 2:\n                continue\n            ref = parts[1].strip()\n            if ref.startswith("refs/heads/"):\n                name = ref[len("refs/heads/"):]\n                if name and name not in branches:\n                    branches.append(name)\n        if not branches:\n            raise RuntimeError("لم يتم العثور على أي فرع في GitHub.")\n        return sorted(branches, key=lambda value: (value != "main", value.lower()))\n\n    def _apply_branches(self, branches):\n        current = self.branch_var.get().strip()\n        self.branches = list(branches)\n        values = (ALL_BRANCH, *self.branches)\n        self.branch_combo.configure(values=values)\n        if current in values:\n            self.branch_var.set(current)\n        elif DEFAULT_BRANCH in self.branches:\n            self.branch_var.set(DEFAULT_BRANCH)\n        else:\n            self.branch_var.set(self.branches[0])\n        self._branch_changed()\n        self._write(f"تم تحديث قائمة الفروع من GitHub: {len(self.branches)} فرعًا.")\n\n    def refresh_branches(self):\n        if self.running:\n            return\n        self._status("جاري تحديث الفروع...", self.accent)\n        threading.Thread(target=self._refresh_branches_worker, daemon=True).start()\n\n    def _refresh_branches_worker(self):\n        try:\n            branches = self._discover_remote_branches()\n            self.root.after(0, self._apply_branches, branches)\n            self.root.after(0, self._status, "جاهز للاستعادة", self.success)\n        except Exception as exc:\n            self._ui(f"تعذر تحديث قائمة الفروع: {exc}")\n            self.root.after(0, self._status, "تعذر تحديث الفروع — القائمة السابقة متاحة", self.warning)\n\n'''
          if marker not in s:
              raise SystemExit('Insertion marker missing; refusing to modify.')
          s = s.replace(marker, methods + marker, 1)
          old_restore = '''    def _restore(self):\n        branch = self.branch\n        remote_ref = f"{REMOTE}/{branch}" if branch != ALL_BRANCH else None\n        try:\n            if branch == ALL_BRANCH:\n                self._restore_all()\n                return\n'''
          new_restore = '''    def _restore(self):\n        branch = self.branch\n        try:\n            branches = self._discover_remote_branches()\n            self.root.after(0, self._apply_branches, branches)\n            branch = self.branch_var.get().strip()\n            if branch == ALL_BRANCH:\n                self._restore_all(branches)\n                return\n            if branch not in branches:\n                raise RuntimeError(f"الفرع غير موجود حاليًا على GitHub: {branch}")\n            remote_ref = f"{REMOTE}/{branch}"\n'''
          if old_restore not in s:
              raise SystemExit('Restore marker missing; refusing to modify.')
          s = s.replace(old_restore, new_restore, 1)
          s = s.replace('def _sync_all_refs(self):', 'def _sync_all_refs(self, branches):', 1)
          start = s.index('    def _sync_all_refs(self, branches):')
          end = s.index('    def _stats(self, target_commit):', start)
          sync = '''    def _sync_all_refs(self, branches):\n        """Fetch every current GitHub branch into local remote-tracking refs."""\n        self._ui(f"[ALL] جلب جميع فروع GitHub ({len(branches)} فرعًا) إلى مستودع Git المحلي...")\n        code, lines = self._git(["fetch", REMOTE, "--prune"])\n        if code != 0:\n            raise RuntimeError("فشل تحديث فروع GitHub.\\n" + ("\\n".join(lines) or "Git fetch --prune failed."))\n        for line in lines:\n            self._ui(line)\n        commits = {}\n        for index, branch in enumerate(branches, 1):\n            code, lines = self._git(["fetch", REMOTE, branch])\n            if code != 0:\n                raise RuntimeError(f"فشل جلب GitHub/{branch}.\\n" + ("\\n".join(lines) or "Git fetch failed."))\n            ref = f"{REMOTE}/{branch}"\n            commits[branch] = self._git_value(["rev-parse", "--verify", ref])\n            self._ui(f"[{index}/{len(branches)}] GitHub/{branch}: {commits[branch]}")\n        current_branch = self._git_value(["branch", "--show-current"])\n        current_commit = self._git_value(["rev-parse", "HEAD"])\n        self._ui(f"Local working branch remains: {current_branch or '(detached HEAD)'}")\n        self._ui(f"Local working commit remains: {current_commit}")\n        self._save_all_sync_state(commits)\n        return commits\n\n'''
          s = s[:start] + sync + s[end:]
          s = s.replace('def _restore_all(self):', 'def _restore_all(self, branches):', 1)
          s = s.replace('ALL = تحديث الفروع الثلاثة داخل مستودع Git المحلي.', 'ALL = تحديث جميع فروع GitHub الحالية ({len(branches)} فرعًا) داخل مستودع Git المحلي.', 1)
          s = s.replace('commits = self._sync_all_refs()', 'commits = self._sync_all_refs(branches)', 1)
          s = s.replace('الفروع الثلاثة محدثة محليًا.', 'تم تحديث {len(commits)} فرعًا محليًا.', 1)
          s = s.replace('تمت مزامنة الفروع الثلاثة محليًا. الإحصائيات: 0 لأن working tree لم يتغير.', 'تمت مزامنة جميع الفروع ({len(commits)}) محليًا. الإحصائيات: 0 لأن working tree لم يتغير.', 1)
          old_main = '''    root = tk.Tk()\n    app = OrionRestoreApp(root)\n    app.source_label.configure(\n        text=("GitHub → Git → Local  |  ALL (3 branches)"\n              if app.branch == ALL_BRANCH\n              else f"GitHub → Git → Local  |  {app.branch}")\n    )\n    root.mainloop()\n'''
          new_main = '''    root = tk.Tk()\n    app = OrionRestoreApp(root)\n    app.source_label.configure(\n        text=(f"GitHub → Git → Local  |  ALL ({len(app.branches)} branches)"\n              if app.branch == ALL_BRANCH\n              else f"GitHub → Git → Local  |  {app.branch}")\n    )\n    root.after(250, app.refresh_branches)\n    root.mainloop()\n'''
          if old_main not in s:
              raise SystemExit('Main marker missing; refusing to modify.')
          s = s.replace(old_main, new_main, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit change
        shell: bash
        run: |
          git config user.name 'ORION automation'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/orion_restore_gui.pyw
          git commit -m 'Update ORION Restore: discover and sync all branches'
          git push
