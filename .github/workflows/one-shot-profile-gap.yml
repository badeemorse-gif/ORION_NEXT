name: ORION one-shot Profile Fail-Closed
on:
  push:
    branches:
      - phase2/core-intelligence-hardening
permissions:
  contents: write
jobs:
  apply-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted code change and verify
        run: |
          if [ "${{ github.event.head_commit.message }}" != "ci: apply profile fail-closed patch" ]; then exit 0; fi
          python -m pip install -r binansScanner/requirements.txt numpy pandas pandas-ta python-binance
          python - <<'PY'
          from pathlib import Path
          root = Path('binansScanner')

          p = root / 'engines/indicator_engine.py'
          s = p.read_text()
          s = s.replace('from models.market import MarketDataset, TimeframeData\n', 'from models.indicators import IndicatorResult\nfrom models.market import MarketDataset, TimeframeData\n', 1)
          old = '            calculated = self._calculator.apply_all(dataframe)\n            self._calculator.validate_required_indicators(calculated)\n'
          new = old + '            calculated.attrs["indicator_result"] = IndicatorResult(\n                quality="SUFFICIENT",\n                failed_indicators=[],\n                calculated_indicators=[\n                    "ema_9", "ema_20", "ema_50", "ema_100", "ema_200",\n                    "adx_14", "rsi_14", "momentum_5", "momentum_10",\n                    "mfi_14", "atr_14",\n                ],\n                warnings=[],\n            )\n'
          if old not in s: raise SystemExit('indicator engine calculation anchor not found')
          s = s.replace(old, new, 1)
          old = '        timeframe_data.dataframe = dataframe[base_columns].copy()\n        return timeframe_data\n'
          new = '        cleaned = dataframe[base_columns].copy()\n        cleaned.attrs.pop("indicator_result", None)\n        timeframe_data.dataframe = cleaned\n        return timeframe_data\n'
          if old not in s: raise SystemExit('indicator engine clear anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = root / 'engines/profile_builder.py'
          s = p.read_text()
          s = s.replace('from models.profile import (\n', 'from models.indicators import IndicatorResult\nfrom models.profile import (\n', 1)
          anchor = 'logger = logging.getLogger(__name__)\n\n# -----------------------------------------------------------------------------\n# Compatibility export\n'
          replacement = 'logger = logging.getLogger(__name__)\n\nCRITICAL_PROFILE_INDICATORS: tuple[str, ...] = (\n    "ema_9", "ema_20", "ema_50", "ema_100", "ema_200",\n    "adx_14", "rsi_14", "momentum_5", "momentum_10",\n    "mfi_14", "atr_14",\n)\n\n# -----------------------------------------------------------------------------\n# Compatibility export\n'
          if anchor not in s: raise SystemExit('profile builder constant anchor not found')
          s = s.replace(anchor, replacement, 1)
          anchor = '        if df is None or df.empty:\n            return MarketCharacteristics()\n\n        latest = df.iloc[-1]\n'
          replacement = '        if df is None or df.empty:\n            return MarketCharacteristics()\n\n        self._validate_intelligence_input(df)\n        latest = df.iloc[-1]\n'
          if anchor not in s: raise SystemExit('profile builder build anchor not found')
          s = s.replace(anchor, replacement, 1)
          anchor = '    # =========================================================================\n    # Feature Extraction\n'
          validator = '''    def _validate_intelligence_input(self, df: pd.DataFrame) -> None:\n        """Reject incomplete indicator intelligence before classification."""\n        missing = [\n            name\n            for name in CRITICAL_PROFILE_INDICATORS\n            if name not in df.columns\n        ]\n        if missing:\n            raise ValueError(\n                "Profile intelligence blocked: missing critical indicators: "\n                + ", ".join(missing)\n            )\n\n        metadata = df.attrs.get("indicator_result")\n        if metadata is not None:\n            if not isinstance(metadata, IndicatorResult):\n                raise ValueError(\n                    "Profile intelligence blocked: invalid indicator metadata."\n                )\n            if metadata.quality != "SUFFICIENT" or metadata.failed_indicators:\n                raise ValueError(\n                    "Profile intelligence blocked: indicator metadata reports "\n                    "failed or insufficient indicators."\n                )\n\n        latest = df.iloc[-1]\n        invalid = [\n            name\n            for name in CRITICAL_PROFILE_INDICATORS\n            if not np.isfinite(float(latest[name]))\n        ]\n        if invalid:\n            raise ValueError(\n                "Profile intelligence blocked: invalid critical indicators: "\n                + ", ".join(invalid)\n            )\n\n        if len(df) >= 5 and not np.isfinite(\n            df["ema_20"].tail(5).astype(float).to_numpy()\n        ).all():\n            raise ValueError(\n                "Profile intelligence blocked: invalid ema_20 slope history."\n            )\n\n'''
          if anchor not in s: raise SystemExit('profile builder feature anchor not found')
          s = s.replace(anchor, validator + anchor, 1)
          p.write_text(s)

          p = root / 'core/orchestrator.py'
          s = p.read_text()
          anchor = '            self._change_stage(PipelineStage.PROFILE)\n            profile = self._profile_engine.build_profile(dataset)\n            completed += 1\n\n            self._change_stage(PipelineStage.SCORE)\n'
          replacement = '            self._change_stage(PipelineStage.PROFILE)\n            profile = self._profile_engine.build_profile(dataset)\n            if not profile.is_tradeable:\n                blocked = "; ".join(profile.blocks) or "Profile intelligence is not tradeable."\n                raise PipelineError(\n                    f"Profile intelligence blocked before Score/Decision: {blocked}"\n                )\n            completed += 1\n\n            self._change_stage(PipelineStage.SCORE)\n'
          if anchor not in s: raise SystemExit('orchestrator profile gate anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          p = root / 'tests/test_profile_contract.py'
          s = p.read_text()
          s = s.replace('import unittest\nfrom datetime import datetime, timezone\n', 'import unittest\nfrom datetime import datetime, timezone\n\nimport numpy as np\nimport pandas as pd\n\nfrom enums import DataHealth, Timeframe\n', 1)
          s = s.replace('from engines.profile_engine import ProfileEngine\n', 'from engines.profile_builder import ProfileBuilder\nfrom engines.profile_engine import ProfileEngine\n', 1)
          s = s.replace('from models.market import MarketDataset, MarketMetadata\n', 'from models.indicators import IndicatorResult\nfrom models.market import MarketDataset, MarketMetadata, TimeframeData\n', 1)
          anchor = '    def test_profile_engine_exposes_canonical_result_boundary(self):\n'
          tests = '''    def _prepared_timeframe(self) -> TimeframeData:\n        index = pd.date_range("2026-01-01", periods=250, freq="1h", tz="UTC")\n        base = np.linspace(100.0, 150.0, len(index))\n        df = pd.DataFrame({\n            "open": base, "high": base + 2.0, "low": base - 2.0,\n            "close": base + 1.0, "volume": np.linspace(1000.0, 2000.0, len(index)),\n        }, index=index)\n        for name in ("ema_9", "ema_20", "ema_50", "ema_100", "ema_200", "adx_14", "rsi_14", "momentum_5", "momentum_10", "mfi_14", "atr_14"):\n            df[name] = 1.0\n        df["ema_20"] = np.linspace(110.0, 120.0, len(index))\n        df["ema_50"] = np.linspace(105.0, 115.0, len(index))\n        df["ema_100"] = np.linspace(102.0, 112.0, len(index))\n        df["ema_200"] = np.linspace(101.0, 111.0, len(index))\n        df["ema_9"] = np.linspace(112.0, 122.0, len(index))\n        df["adx_14"] = 30.0\n        df["rsi_14"] = 60.0\n        df["mfi_14"] = 60.0\n        df["atr_14"] = 1.0\n        df["momentum_5"] = 1.0\n        df["momentum_10"] = 1.0\n        df.attrs["indicator_result"] = IndicatorResult(quality="SUFFICIENT", calculated_indicators=["ema_9", "ema_20", "ema_50", "adx_14", "rsi_14", "momentum_5"])\n        return TimeframeData(timeframe=Timeframe.H1, dataframe=df, data_health=DataHealth.GOOD, candles_count=len(df), first_timestamp=df.index[0].to_pydatetime(), last_timestamp=df.index[-1].to_pydatetime())\n\n    def _profile_result(self, timeframe_data: TimeframeData) -> ProfileResult:\n        dataset = self._empty_dataset()\n        dataset.add_timeframe(timeframe_data)\n        return ProfileEngine().build_profile(dataset)\n\n    def test_missing_critical_indicator_fails_closed(self):\n        timeframe_data = self._prepared_timeframe()\n        timeframe_data.dataframe = timeframe_data.dataframe.drop(columns=["ema_20"])\n        result = self._profile_result(timeframe_data)\n        self.assertFalse(result.is_tradeable)\n        self.assertTrue(any("missing critical indicators" in block for block in result.blocks))\n\n    def test_nan_critical_indicator_fails_closed(self):\n        timeframe_data = self._prepared_timeframe()\n        timeframe_data.dataframe.loc[timeframe_data.dataframe.index[-1], "rsi_14"] = np.nan\n        result = self._profile_result(timeframe_data)\n        self.assertFalse(result.is_tradeable)\n        self.assertTrue(any("invalid critical indicators" in block for block in result.blocks))\n\n    def test_failed_indicator_metadata_fails_closed(self):\n        timeframe_data = self._prepared_timeframe()\n        timeframe_data.dataframe.attrs["indicator_result"] = IndicatorResult(quality="FAILED", failed_indicators=["rsi_14"])\n        result = self._profile_result(timeframe_data)\n        self.assertFalse(result.is_tradeable)\n        self.assertTrue(any("indicator metadata reports failed" in block for block in result.blocks))\n\n    def test_valid_complete_indicators_produce_tradeable_profile(self):\n        result = self._profile_result(self._prepared_timeframe())\n        self.assertTrue(result.is_tradeable)\n        self.assertEqual(len(result.blocks), 0)\n        self.assertEqual(len(result.timeframes), 1)\n\n    def test_profile_builder_rejects_invalid_indicator_metadata(self):\n        timeframe_data = self._prepared_timeframe()\n        timeframe_data.dataframe.attrs["indicator_result"] = IndicatorResult(quality="FAILED", failed_indicators=["ema_20"])\n        with self.assertRaises(ValueError):\n            ProfileBuilder().build(timeframe_data.dataframe)\n\n'''
          if anchor not in s: raise SystemExit('profile test anchor not found')
          s = s.replace(anchor, tests + anchor, 1)
          p.write_text(s)

          p = root / 'tests/test_pipeline_execution_e2e.py'
          s = p.read_text()
          if 'periods=60,' not in s: raise SystemExit('e2e fixture anchor not found')
          s = s.replace('periods=60,', 'periods=250,', 1)
          s = s.replace('for index in range(60)', 'for index in range(250)', 1)
          p.write_text(s)

          (Path('.github/profile-gap.patch')).unlink(missing_ok=True)
          Path('.github/workflows/one-shot-profile-gap.yml').unlink()
          PY
          python -m compileall -q binansScanner
          cd binansScanner
          python -m unittest discover -s tests -p 'test_*.py' -v
          cd ..
          git config user.name 'ORION Developer'
          git config user.email 'orion-developer@users.noreply.github.com'
          git add binansScanner .github
          git commit -m 'feat: close profile intelligence fail-closed gap'
          git push origin phase2/core-intelligence-hardening
