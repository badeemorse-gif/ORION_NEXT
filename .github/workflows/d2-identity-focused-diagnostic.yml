name: D2 Identity Focused Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: binansScanner
        run: python -m pip install -r requirements.txt numpy pandas pandas-ta python-binance
      - name: Run focused replay identity test
        working-directory: binansScanner
        run: python -m unittest tests.test_historical_paper_replay.TestHistoricalPaperReplay.test_event_identity_and_duplicate_protection_are_stable -v
