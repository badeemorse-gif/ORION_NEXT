name: D5 SignalOutcome Adapter Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - developer5/experiment-harness-phase-a
  workflow_dispatch:

jobs:
  verify-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved source revision
        uses: actions/checkout@v4
        with:
          ref: 2e48a0110277a0163217a9780aaa6f81a5bb38e4
          fetch-depth: 0

      - name: Assert exact approved source checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="2e48a0110277a0163217a9780aaa6f81a5bb38e4"
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_SOURCE_SHA=%s\nACTUAL_CHECKOUT_SHA=%s\n' "$expected" "$actual"
          test "$expected" = "$actual"

      - name: Print test file blob
        shell: bash
        run: |
          set -euo pipefail
          printf 'TEST_FILE_BLOB='
          git rev-parse HEAD:tools/tests/test_forward_outcome_validation.py
          printf 'ADAPTER_BLOB='
          git rev-parse HEAD:tools/signal_outcome_adapter.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install D5 test dependencies
        run: python -m pip install --upgrade pip

      - name: Run D5 adapter and forward-outcome tests
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python -m unittest tools.tests.test_forward_outcome_validation -v 2>&1 | tee d5-adapter-test.log

      - name: Assert working tree clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Upload D5 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d5-signal-outcome-adapter-verification-${{ github.sha }}
          path: d5-adapter-test.log
          if-no-files-found: error
